# Staging stack — runs beside prod on the same VPS.
# Usage:
#   docker compose -f docker-compose.staging.yml -p qalam-staging --env-file .env.staging up -d --build
#
# Binds: API 127.0.0.1:8081, admin 127.0.0.1:8092, teacher 127.0.0.1:8093

name: qalam-staging

x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: qalam-staging-rabbitmq
    logging: *docker-logging
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-qalam}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_staging_data:/var/lib/rabbitmq
    networks:
      - qalam-staging-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  messaging-api:
    build:
      context: .
      dockerfile: Qalam.MessagingApi/Dockerfile
    image: qalam-messaging-api:staging
    container_name: qalam-staging-messaging-api
    logging: *docker-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MessagingDb=${DB_CONNECTION_STRING}
      - RabbitMQSettings__HostName=rabbitmq
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__UserName=${RABBITMQ_USER:-qalam}
      - RabbitMQSettings__Password=${RABBITMQ_PASS}
      - RabbitMQSettings__VirtualHost=/
      - RabbitMQSettings__EmailQueueName=email-queue
      - RabbitMQSettings__SmsQueueName=sms-queue
      - RabbitMQSettings__PushQueueName=push-queue
      - RabbitMQSettings__TeacherDocUploadQueueName=teacher-doc-upload-queue
      - RabbitMQSettings__ProfilePicUploadQueueName=profile-pic-upload-queue
      - RabbitMQSettings__OpenSessionRequestAttachmentUploadQueueName=open-session-request-attachment-upload-queue
      - RabbitMQSettings__TeacherContentFileUploadQueueName=teacher-content-file-upload-queue
      - EmailSettings__Host=${EMAIL_HOST}
      - EmailSettings__Port=${EMAIL_PORT:-465}
      - EmailSettings__FromName=${EMAIL_FROM_NAME}
      - EmailSettings__FromEmail=${EMAIL_FROM_EMAIL}
      - EmailSettings__ReplyToEmail=${EMAIL_REPLY_TO:-}
      - EmailSettings__UserName=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__EnableSsl=true
      - EmailSettings__SecureSocketMode=${EMAIL_SECURE_SOCKET_MODE:-SslOnConnect}
      - EmailSettings__DefaultStrategy=Queued
      - BounceIngestSettings__Enabled=${EMAIL_IMAP_ENABLED:-false}
      - BounceIngestSettings__Host=${EMAIL_IMAP_HOST:-}
      - BounceIngestSettings__Port=${EMAIL_IMAP_PORT:-993}
      - BounceIngestSettings__UseSsl=${EMAIL_IMAP_SSL:-true}
      - BounceIngestSettings__UserName=${EMAIL_IMAP_USERNAME:-}
      - BounceIngestSettings__Password=${EMAIL_IMAP_PASSWORD:-}
      - BounceIngestSettings__ProcessedFolder=${EMAIL_IMAP_PROCESSED_FOLDER:-}
      - BounceIngestSettings__PollIntervalMinutes=${EMAIL_IMAP_POLL_MINUTES:-5}
      - SmsSettings__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - SmsSettings__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - SmsSettings__FromNumber=${TWILIO_FROM_NUMBER:-}
      - PushNotificationSettings__ServiceAccountKeyPath=${FIREBASE_KEY_PATH:-}
      - PushNotificationSettings__ProjectId=${FIREBASE_PROJECT_ID:-}
      - OssSettings__AccessKeyId=${OSS_ACCESS_KEY_ID:-}
      - OssSettings__AccessKeySecret=${OSS_ACCESS_KEY_SECRET:-}
      - OssSettings__BucketName=${OSS_BUCKET:-auth-and-identities-certificates-staging}
      - OssSettings__Region=${OSS_REGION:-me-central-1}
      - OssSettings__Endpoint=${OSS_ENDPOINT:-https://oss-me-central-1.aliyuncs.com}
      - OssSettings__PublicBaseUrl=${OSS_PUBLIC_BASE_URL:-https://auth-and-identities-certificates-staging.oss-me-central-1.aliyuncs.com}
      - OssSettings__LearningBucketName=${OSS_LEARNING_BUCKET:-qalam-content-stg}
      - OssSettings__LearningPublicBaseUrl=${OSS_LEARNING_PUBLIC_BASE_URL:-https://qalam-content-stg.oss-me-central-1.aliyuncs.com}
      - OssSettings__UseInternalEndpoint=${OSS_USE_INTERNAL_ENDPOINT:-false}
      - OssSettings__EcsRoleName=${OSS_ECS_ROLE_NAME:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - qalam-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/messaging/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  qalam-api:
    build:
      context: .
      dockerfile: Qalam.Api/Dockerfile
    image: qalam-backend-api:staging
    container_name: qalam-staging-backend-api
    logging: *docker-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__dbcontext=${DB_CONNECTION_STRING}
      - MIGRATE_ON_STARTUP=${MIGRATE_ON_STARTUP:-true}
      - SEED_DEFAULT_ADMIN=${SEED_DEFAULT_ADMIN:-true}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - EncryptionSettings__Key=${ENCRYPTION_KEY}
      - jwtSettings__Secret=${JWT_SECRET}
      - jwtSettings__Issuer=${JWT_ISSUER:-QalamProject-Staging}
      - jwtSettings__Audience=${JWT_AUDIENCE:-QalamProjectUsers-Staging}
      - jwtSettings__AccessTokenExpireDate=60
      - jwtSettings__RefreshTokenExpireDate=43200
      - jwtSettings__ValidateIssuer=true
      - jwtSettings__ValidateAudience=true
      - jwtSettings__ValidateLifeTime=true
      - jwtSettings__ValidateIssuerSigningKey=true
      - MessagingApi__BaseUrl=http://messaging-api
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - PlatformSettings__WebAppBaseUrl=${PLATFORM_WEB_APP_BASE_URL:-https://qalam.net.sa/}
      - PlatformSettings__ApiPublicBaseUrl=${PLATFORM_API_PUBLIC_BASE_URL:-https://api-staging.qalam.net.sa}
      - LiveSession__Provider=${LIVE_SESSION_PROVIDER:-LiveKit}
      - LiveSession__LiveKit__Url=${LIVEKIT_URL:-}
      - LiveSession__LiveKit__ApiKey=${LIVEKIT_API_KEY:-}
      - LiveSession__LiveKit__ApiSecret=${LIVEKIT_API_SECRET:-}
      - LiveSession__LiveKit__TokenTtlMinutes=${LIVEKIT_TOKEN_TTL_MINUTES:-120}
      - SessionSettings__EnforceJoinWindow=${SESSION_ENFORCE_JOIN_WINDOW:-true}
      - RabbitMQSettings__HostName=rabbitmq
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__UserName=${RABBITMQ_USER:-qalam}
      - RabbitMQSettings__Password=${RABBITMQ_PASS}
      - RabbitMQSettings__VirtualHost=/
      - RabbitMQSettings__EmailQueueName=email-queue
      - RabbitMQSettings__SmsQueueName=sms-queue
      - RabbitMQSettings__PushQueueName=push-queue
      - RabbitMQSettings__TeacherDocUploadQueueName=teacher-doc-upload-queue
      - RabbitMQSettings__ProfilePicUploadQueueName=profile-pic-upload-queue
      - RabbitMQSettings__OpenSessionRequestAttachmentUploadQueueName=open-session-request-attachment-upload-queue
      - RabbitMQSettings__TeacherContentFileUploadQueueName=teacher-content-file-upload-queue
      - OssSettings__PublicBaseUrl=${OSS_PUBLIC_BASE_URL}
      - OssSettings__LearningPublicBaseUrl=${OSS_LEARNING_PUBLIC_BASE_URL}
      - OssSettings__BucketName=${OSS_BUCKET}
      - OssSettings__LearningBucketName=${OSS_LEARNING_BUCKET}
      - OssSettings__AccessKeyId=${OSS_ACCESS_KEY_ID:-}
      - OssSettings__AccessKeySecret=${OSS_ACCESS_KEY_SECRET:-}
      - OssSettings__Region=${OSS_REGION:-me-central-1}
      - OssSettings__Endpoint=${OSS_ENDPOINT}
      - OssSettings__UseInternalEndpoint=${OSS_USE_INTERNAL_ENDPOINT:-true}
      - OssSettings__EcsRoleName=${OSS_ECS_ROLE_NAME:-}
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - app_staging_logs:/app/Logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      messaging-api:
        condition: service_started
    networks:
      - qalam-staging-network
    restart: unless-stopped

  qalam-admin:
    build:
      context: ${ADMIN_APP_PATH:-./apps/admin}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${ADMIN_API_URL:-https://api-staging.qalam.net.sa}
    image: qalam-admin:staging
    container_name: qalam-staging-admin
    logging: *docker-logging
    ports:
      - "127.0.0.1:8092:3000"
    networks:
      - qalam-staging-network
    restart: unless-stopped

  qalam-teacher:
    build:
      context: ${TEACHER_APP_PATH:-./apps/teacher}
      dockerfile: Dockerfile
      args:
        MODE: ${TEACHER_BUILD_MODE:-staging}
        VITE_API_URL: ${TEACHER_API_URL:-https://api-staging.qalam.net.sa}
    image: qalam-teacher:staging
    container_name: qalam-staging-teacher
    logging: *docker-logging
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    ports:
      - "127.0.0.1:8093:3000"
    networks:
      - qalam-staging-network
    restart: unless-stopped

volumes:
  rabbitmq_staging_data:
  app_staging_logs:

networks:
  qalam-staging-network:
    driver: bridge

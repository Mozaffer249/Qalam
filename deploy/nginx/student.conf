server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default: revalidate. Flutter web keeps unhashed names for index.html,
    # main.dart.js, AssetManifest.bin, and assets/translations/*.json.
    # Caching those for a year leaves old copy / missing .tr() strings after deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # WASM / canvaskit blobs are content-addressed enough to keep.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
